name: Update Allstar Clips

on:
  schedule:
    - cron: '0 */6 * * *' # Executa a cada 6 horas
  workflow_dispatch: # Permite execução manual a qualquer momento via aba Actions no GitHub!

permissions:
  contents: write

jobs:
  update-clips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch Allstar Clips Data
        env:
          ALLSTAR_API_KEY: ${{ secrets.ALLSTAR_API_KEY }}
        run: node scripts/fetch-allstar.js

      - name: Commit & Push updated clips JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Allstar player clips"
          branch: main
